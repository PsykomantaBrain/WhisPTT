name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Stage plugin folder
        run: |
          mkdir -p out/WhisPTT
          cp -r dist plugin.json package.json LICENSE README.md *.py out/WhisPTT/

      - name: Zip
        run: cd out && zip -r WhisPTT.zip WhisPTT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/WhisPTT.zip
          generate_release_notes: true
